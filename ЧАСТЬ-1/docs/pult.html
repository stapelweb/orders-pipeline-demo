*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg-page); color:var(--text-body);
  font:14px/1.5 var(--font-ui); -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── шапка ─────────────────────────────────────────── */
.top{
  display:flex; align-items:center; gap:20px; padding:12px 20px;
  background:var(--surface-1); border-bottom:1px solid var(--border-hairline);
  position:sticky; top:0; z-index:10; flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;margin:0;
  letter-spacing:-.01em;color:var(--text-strong)}
.brand .dot{width:8px;height:8px;border-radius:var(--radius-pill);
  background:var(--signal-good);box-shadow:0 0 10px var(--signal-good)}
.brand em{font-style:normal;color:var(--signal-good)}
.top .grow{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;
  background:var(--surface-3); border:1px solid var(--border-hairline);
  border-radius:var(--radius-pill); font-size:11.5px; color:var(--text-muted);
}
.pill .dot{width:6px;height:6px;border-radius:var(--radius-pill);background:var(--signal-good)}

/* ── раскладка ─────────────────────────────────────── */
.app{display:grid;grid-template-columns:214px minmax(0,1fr) 340px;
  gap:1px;background:var(--border-hairline);min-height:calc(100vh - 53px)}
.col{background:var(--bg-page);padding:16px;min-width:0}
.label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:9px}

/* ── навигация ─────────────────────────────────────── */
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.nav button{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:var(--radius-md);color:var(--text-muted);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
  text-align:left;
}
.nav button:hover{background:var(--surface-2);color:var(--text-body)}
.nav button[aria-selected="true"]{background:var(--surface-3);color:var(--text-strong);
  box-shadow:inset 2px 0 0 var(--signal-good)}
.nav .n{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)}
.nav button[aria-selected="true"] .n{color:var(--signal-good)}

.agents{display:flex;flex-direction:column;gap:7px;margin-bottom:22px}
.agent{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted)}
.agent i{width:6px;height:6px;border-radius:var(--radius-pill);flex:none}

.srcs{display:flex;flex-direction:column;gap:5px}
.src{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-muted)}
.src b{font-family:var(--font-mono);font-weight:400;color:var(--text-faint)}

/* ── центр ─────────────────────────────────────────── */
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:160px;position:relative}
.search input{
  width:100%;padding:8px 11px 8px 30px;background:var(--surface-inset);
  border:1px solid var(--border-hairline);border-radius:var(--radius-md);
  color:var(--text-body);font:13px var(--font-ui);outline:none;
}
.search input:focus{border-color:var(--cyan-500)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;stroke:var(--text-faint);fill:none;stroke-width:2}
.seg{display:flex;background:var(--surface-inset);border:1px solid var(--border-hairline);
  border-radius:var(--radius-md);overflow:hidden}
.seg button{padding:7px 12px;font-size:12px;color:var(--text-muted)}
.seg button[aria-selected="true"]{background:var(--surface-3);color:var(--text-strong)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--border-hairline);border:1px solid var(--border-hairline);
  border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px}
.stat{background:var(--surface-1);padding:11px 13px}
.stat .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.stat .v{font-family:var(--font-mono);font-size:22px;color:var(--text-strong);margin-top:3px}
.stat.good .v{color:var(--signal-good)}
.stat.stop .v{color:var(--signal-stop)}

.rows{border:1px solid var(--border-hairline);border-radius:var(--radius-lg);overflow:hidden}
.row{
  display:grid;grid-template-columns:44px minmax(0,1fr) 96px 92px;
  gap:10px;align-items:center;padding:10px 13px;
  background:var(--surface-1);border-bottom:1px solid var(--border-hairline);
  cursor:pointer;transition:background var(--dur) var(--ease);
  border-left:2px solid transparent;
}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row[aria-selected="true"]{background:var(--surface-selected);border-left-color:var(--signal-info)}
.row .score{font-family:var(--font-mono);font-size:14px;text-align:right}
.row .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-strong);font-size:13px}
.row .sub{font-size:11px;color:var(--text-faint);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bud{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);text-align:right}
.badge{
  display:inline-block;padding:3px 8px;border-radius:var(--radius-sm);
  font-size:11px;line-height:1.3;white-space:nowrap;text-align:center;
}
.b-good{background:var(--lime-900);color:var(--lime-500)}
.b-watch{background:var(--amber-900);color:var(--amber-500)}
.b-stop{background:var(--red-900);color:var(--red-500)}
.b-work{background:var(--violet-900);color:var(--violet-500)}
.b-info{background:var(--cyan-900);color:var(--cyan-500)}
.b-idle{background:var(--surface-3);color:var(--text-faint)}

.empty{padding:44px 20px;text-align:center;color:var(--text-faint);
  background:var(--surface-1);border:1px solid var(--border-hairline);
  border-radius:var(--radius-lg)}
.empty svg{width:26px;height:26px;stroke:var(--text-faint);fill:none;stroke-width:1.5;
  margin-bottom:9px}

/* ── правая панель ─────────────────────────────────── */
.card{background:var(--surface-1);border:1px solid var(--border-hairline);
  border-radius:var(--radius-lg);padding:15px;margin-bottom:12px}
.gauge{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.gauge .num{font-family:var(--font-mono);font-size:38px;line-height:1;color:var(--signal-good)}
.gauge .max{font-family:var(--font-mono);font-size:13px;color:var(--text-faint)}
.meter{height:4px;background:var(--surface-inset);border-radius:var(--radius-pill);
  overflow:hidden;margin:9px 0 6px}
.meter i{display:block;height:100%;background:var(--signal-good);border-radius:inherit;
  transition:width var(--dur) var(--ease)}
.verdict{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--signal-good)}
.h{font-size:16px;line-height:1.35;color:var(--text-strong);margin:12px 0 10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.kv .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.kv .v{font-size:13px;color:var(--text-body);margin-top:2px}
.kv .v.mono{font-family:var(--font-mono)}
.why{list-style:none;display:flex;flex-direction:column;gap:7px}
.why li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  color:var(--text-muted);padding-bottom:7px;border-bottom:1px solid var(--border-hairline)}
.why li:last-child{border-bottom:none;padding-bottom:0}
.why b{font-family:var(--font-mono);font-weight:400;color:var(--signal-good);white-space:nowrap}
.why b.neg{color:var(--signal-stop)}
.act{display:flex;gap:8px;margin-top:12px}
.btn{padding:9px 14px;border-radius:var(--radius-md);font-size:13px;
  background:var(--signal-good);color:var(--ink-950);font-weight:600;
  transition:opacity var(--dur) var(--ease)}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--surface-3);color:var(--text-body);font-weight:400;
  border:1px solid var(--border-hairline)}
.note{font-size:12px;color:var(--text-faint);margin-top:10px;line-height:1.45}
.hint{padding:9px 11px;border-radius:var(--radius-md);font-size:12px;
  display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.hint.stop{background:var(--red-900);color:var(--red-500)}
.hint.watch{background:var(--amber-900);color:var(--amber-500)}
.hint b{display:block;color:inherit;margin-bottom:2px}
.hint span{color:var(--text-body);opacity:.85}

footer{padding:14px 20px;border-top:1px solid var(--border-hairline);
  font-size:11.5px;color:var(--text-faint);display:flex;gap:16px;flex-wrap:wrap}
footer a{color:var(--cyan-500)}

@media (max-width:1080px){
  .app{grid-template-columns:1fr}
  .col.side{order:2} .col.main{order:1} .col.right{order:3}
  .row{grid-template-columns:40px minmax(0,1fr) 84px}
  .row .bud{display:none}
}

   "источник": "FL.ru",
   "цена": 15000,
   "агент": "marketer",
   "статус": "отклик"
  },
  {
   "название": "ИИ-агент автозагрузки Shorts (Kwork)",
   "источник": "Kwork",
   "цена": 6000,
   "агент": "webdev",
   "статус": "отклик"
  },
  {
   "название": "Автоматизация доступа в Telegram-клуб (Лидеры)",
   "источник": "Лидеры мнений",
   "цена": 15000,
   "агент": "webdev",
   "статус": "отклик"
  },
  {
   "название": "Авитолог: органическое продвижение курсов (Лидеры)",
   "источник": "Лидеры мнений",
   "цена": 6000,
   "агент": "marketer",
   "статус": "отклонен"
  },
  {
   "название": "Продвижение ВК: магазин одежды с ИИ-контентом (FL.ru)",
   "источник": "FL.ru",
   "цена": 30000,
   "агент": "smm",
   "статус": "отклонен"
  }
 ]
};

const деньги = n => n ? new Intl.NumberFormat('ru-RU').format(n) + ' ₽' : 'не указан';
const срок = m => m === null || m === undefined ? '—'
  : m < 60 ? m + ' мин' : m < 1440 ? Math.floor(m/60) + ' ч' : Math.floor(m/1440) + ' дн';
const экран = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function вердикт(б){
  if (б >= 75) return {к:'b-good',  т:'берём'};
  if (б >= 55) return {к:'b-watch', т:'смотрим'};
  if (б >= 45) return {к:'b-info',  т:'под вопросом'};
  return {к:'b-idle', т:'слабо'};
}
function цветБалла(б){
  return б >= 75 ? 'var(--signal-good)' : б >= 55 ? 'var(--signal-watch)'
       : б >= 45 ? 'var(--signal-info)' : 'var(--text-faint)';
}

let вкладка = 'лента', часы = 0, запрос = '', выбран = 0;

document.getElementById('снято').textContent = 'снимок ' + Д.снято;

document.getElementById('srcs').innerHTML = Д.источники
  .map(s => `<div class="src"><span>${экран(s.имя).replace(' (лента @freelance_zakazy)','')}</span><b>${s.n}</b></div>`)
  .join('');

function вкладки(){
  const t = [
    ['лента','Лента', Д.лента.length],
    ['отсев','Отсев', Д.отсев.length],
    ['работы','Реестр работ', Д.работы.length],
  ];
  document.getElementById('nav').innerHTML = t.map(([k,имя,n]) =>
    `<button data-t="${k}" aria-selected="${вкладка===k}">${имя}<span class="n">${n}</span></button>`).join('');
}

function статистика(){
  const с = Д.сводка;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="k">Найдено</div><div class="v mono">${с.всего}</div></div>
    <div class="stat good"><div class="k">Прошли отбор</div><div class="v mono">${с.прошли}</div></div>
    <div class="stat stop"><div class="k">Отсеяно</div><div class="v mono">${с.отсеяно}</div></div>`;
}

function текущие(){
  let сп = вкладка === 'лента' ? Д.лента : вкладка === 'отсев' ? Д.отсев : Д.работы;
  if (часы) сп = сп.filter(з => (з.минут ?? 1e9) <= часы * 60);
  if (запрос){
    const q = запрос.toLowerCase();
    сп = сп.filter(з => ((з.заказ || з.название || '') + ' ' + (з.услуга || з.агент || '')).toLowerCase().includes(q));
  }
  return сп;
}

function список(){
  const сп = текущие();
  const узел = document.getElementById('список');
  if (!сп.length){
    узел.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
      <div style="color:var(--text-body)">Ничего не найдено</div>
      <div style="margin-top:5px">Снимите фильтр или измените запрос.</div></div>`;
    return;
  }
  узел.innerHTML = '<div class="rows">' + сп.map((з,i) => {
    if (вкладка === 'работы'){
      const с = з.статус;
      const к = с === 'оплачен' ? 'b-good' : с === 'отклик' ? 'b-info'
              : с === 'отклонен' ? 'b-stop' : 'b-idle';
      return `<div class="row" data-i="${i}" aria-selected="${i===выбран}">
        <div class="score" style="color:var(--text-faint)">—</div>
        <div><div class="ttl">${экран(з.название)}</div>
             <div class="sub">${экран(з.агент || '')} · ${экран(з.источник || '')}</div></div>
        <div class="bud mono">${деньги(з.цена)}</div>
        <div><span class="badge ${к}">${экран(с)}</span></div></div>`;
    }
    const б = з.балл ?? 0;
    const в = вкладка === 'отсев'
      ? {к:'b-stop', т:'отсев'}
      : вердикт(б);
    return `<div class="row" data-i="${i}" aria-selected="${i===выбран}">
      <div class="score" style="color:${цветБалла(б)}">${б}</div>
      <div><div class="ttl">${экран(з.заказ)}</div>
           <div class="sub">${экран(з.услуга || '—')} · ${экран((з.источник||'').replace(' (лента @freelance_zakazy)',''))} · ${срок(з.минут)}</div></div>
      <div class="bud mono">${деньги(з.бюджет)}</div>
      <div><span class="badge ${в.к}">${в.т}</span></div></div>`;
  }).join('') + '</div>';

  узел.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => {
    выбран = +r.dataset.i; список(); панель();
  }));
}

function панель(){
  const сп = текущие();
  const з = сп[выбран] || сп[0];
  const узел = document.getElementById('панель');
  if (!з){ узел.innerHTML = `<div class="empty" style="border:none;background:none">Выберите заказ слева</div>`; return; }

  if (вкладка === 'работы'){
    узел.innerHTML = `<div class="card">
      <div class="label">Работа в реестре</div>
      <div class="h">${экран(з.название)}</div>
      <div class="kv">
        <div><div class="k">Цена</div><div class="v mono">${деньги(з.цена)}</div></div>
        <div><div class="k">Статус</div><div class="v">${экран(з.статус)}</div></div>
        <div><div class="k">Агент</div><div class="v">${экран(з.агент || '—')}</div></div>
        <div><div class="k">Площадка</div><div class="v">${экран(з.источник || '—')}</div></div>
      </div>
      <div class="note">Реестр ведётся отдельной таблицей: каждый отклик получает статус
      и причину смены. По нему считается, что сработало, а что нет.</div></div>`;
    return;
  }

  const б = з.балл ?? 0;
  const в = вкладка === 'отсев' ? {к:'b-stop', т:'отсев'} : вердикт(б);
  const причины = [];
  if (з.услуга) причины.push([`профиль «${з.услуга}», совпадения в заголовке`, 'вес 3']);
  if (з.бюджет) причины.push([`бюджет ${деньги(з.бюджет)} выше порога`, '+18']);
  if ((з.минут ?? 1e9) < 180) причины.push(['свежий, меньше 3 ч', '+12']);
  if (з.конкурентов !== null && з.конкурентов !== undefined)
    причины.push([`откликов у конкурентов: ${з.конкурентов}`, з.конкурентов <= 5 ? '+10' : '−6']);
  if (вкладка === 'отсев' && з.причина) причины.push([экран(з.причина), 'отсев']);

  узел.innerHTML = `
    <div class="card">
      <div class="gauge">
        <span class="num" style="color:${цветБалла(б)}">${б}</span>
        <span class="max">/100</span>
      </div>
      <div class="meter"><i style="width:${Math.max(2,Math.min(100,б))}%;background:${цветБалла(б)}"></i></div>
      <div class="verdict" style="color:${цветБалла(б)}">${в.т} · балл</div>
      <div class="h">${экран(з.заказ)}</div>
      <div class="kv">
        <div><div class="k">Бюджет</div><div class="v mono">${деньги(з.бюджет)}</div></div>
        <div><div class="k">Услуга</div><div class="v">${экран(з.услуга || '—')}</div></div>
        <div><div class="k">Площадка</div><div class="v">${экран((з.источник||'').replace(' (лента @freelance_zakazy)',''))}</div></div>
        <div><div class="k">Возраст</div><div class="v mono">${срок(з.минут)}</div></div>
      </div>
      ${з.url ? `<div class="act"><a class="btn" href="${экран(з.url)}" target="_blank" rel="noopener">Открыть заказ</a>
                 <button class="btn ghost">В работу</button></div>` : ''}
    </div>
    <div class="card">
      <div class="label">Почему такой балл</div>
      <ul class="why">${причины.map(([т,в2]) =>
        `<li><span>${т}</span><b class="${String(в2).startsWith('−')||в2==='отсев'?'neg':''}">${в2}</b></li>`).join('')}</ul>
    </div>
    ${вкладка === 'отсев' ? `<div class="hint stop"><span>
        <b>Заказ отсеян автоматически</b>
        <span>Причина записана в базу. По накопленному отсеву раз в неделю проверяем,
        не режет ли фильтр живое: так нашлось стоп-слово «очно», которое рубило «срочно».</span>
      </span></div>` : ''}`;
}

function перерисовать(){ вкладки(); статистика(); список(); панель(); }

document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  вкладка = b.dataset.t; выбран = 0; перерисовать();
});
document.getElementById('окно').addEventListener('click', e => {
  const b = e.target.closest('button[data-h]'); if (!b) return;
  часы = +b.dataset.h; выбран = 0;
  document.querySelectorAll('#окно button').forEach(x =>
    x.setAttribute('aria-selected', x === b));
  список(); панель();
});
document.getElementById('q').addEventListener('input', e => {
  запрос = e.target.value; выбран = 0; список(); панель();
});

перерисовать();
</script>
</body>
</html>
