<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заявка — мини-приложение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --фон: var(--tg-theme-bg-color, #ffffff);
    --текст: var(--tg-theme-text-color, #111111);
    --тусклый: var(--tg-theme-hint-color, #7d8b99);
    --поле: var(--tg-theme-secondary-bg-color, #f1f4f7);
    --акцент: var(--tg-theme-button-color, #2f7bd4);
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px calc(16px + env(safe-area-inset-right)) 32px calc(16px + env(safe-area-inset-left));
    background:var(--фон); color:var(--текст);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  h1{font-size:20px; margin:0 0 4px}
  p.под{margin:0 0 20px; color:var(--тусклый); font-size:14px}
  label{display:block; margin:14px 0 6px; font-size:14px; color:var(--тусклый)}
  input,textarea,select{
    width:100%; padding:12px; border:0; border-radius:10px;
    background:var(--поле); color:var(--текст); font:inherit;
  }
  textarea{min-height:88px; resize:vertical}
  .строка{display:flex; gap:10px}
  .строка > *{flex:1}
  .кто{
    margin-top:18px; padding:12px; border-radius:10px;
    background:var(--поле); font-size:13px; color:var(--тусклый);
    word-break:break-all;
  }
  .ошибка{color:#c0392b}
  button.запас{
    width:100%; margin-top:18px; padding:14px; border:0; border-radius:10px;
    background:var(--акцент); color:#fff; font:inherit; font-weight:600;
  }
</style>
</head>
<body>

<h1>Заявка в работу</h1>
<p class="под">Заполните три поля — заявка уйдёт в чат с ботом.</p>

<label for="имя">Как к вам обращаться</label>
<input id="имя" autocomplete="name" placeholder="Имя">

<div class="строка">
  <div>
    <label for="тема">Что нужно</label>
    <select id="тема">
      <option>Сайт или лендинг</option>
      <option>Телеграм-бот</option>
      <option>Интеграция и выгрузки</option>
      <option>Другое</option>
    </select>
  </div>
  <div>
    <label for="срок">Когда нужно</label>
    <select id="срок">
      <option>Срочно, на этой неделе</option>
      <option>В течение месяца</option>
      <option>Пока узнаю цену</option>
    </select>
  </div>
</div>

<label for="текст">Коротко о задаче</label>
<textarea id="текст" placeholder="Пара предложений — что и зачем"></textarea>

<div class="кто" id="кто">Данные пользователя подставятся из Telegram.</div>

<button class="запас" id="запасная" hidden>Отправить заявку</button>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var поле = document.getElementById('кто');

  // Вне Telegram SDK не подключится — страница обязана это пережить,
  // иначе отладка в обычном браузере превращается в белый экран.
  if (!tg || !tg.initData) {
    поле.innerHTML = '<span class="ошибка">Открыто вне Telegram.</span> ' +
      'Поля работают, отправка — только из чата с ботом.';
    document.getElementById('запасная').hidden = false;
    return;
  }

  tg.ready();
  tg.expand();

  var u = (tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  поле.textContent = 'Telegram: ' + (u.first_name || '—') +
    (u.username ? ' (@' + u.username + ')' : '') + ', id ' + (u.id || '—') +
    ' · версия ' + tg.version + ' · тема ' + tg.colorScheme;

  if (u.first_name) document.getElementById('имя').value = u.first_name;

  tg.MainButton.setText('Отправить заявку');
  tg.MainButton.show();

  function собрать() {
    return {
      имя:   document.getElementById('имя').value.trim(),
      тема:  document.getElementById('тема').value,
      срок:  document.getElementById('срок').value,
      текст: document.getElementById('текст').value.trim(),
      // id не шлём: на сервере его берут из подписанного initData,
      // а не из того, что прислала страница.
      версия: tg.version
    };
  }

  function отправить() {
    var д = собрать();
    if (!д.имя) { tg.showAlert('Заполните имя'); return; }
    // sendData отдаёт данные боту как service message web_app_data
    // и закрывает приложение. Лимит — 4096 байт.
    tg.sendData(JSON.stringify(д));
  }

  tg.MainButton.onClick(отправить);
  document.getElementById('запасная').onclick = отправить;
})();
</script>
</body>
</html>
